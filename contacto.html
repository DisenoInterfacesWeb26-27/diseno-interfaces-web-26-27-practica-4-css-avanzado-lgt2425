<section>
    <h2>Formulario de contacto</h2>

    <form action="#" method="POST">

        <fieldset>
            <legend>Datos personales</legend>

            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre"
            placeholder="Introduce tu nombre"
            maxlength="40"
            pattern="[A-Za-zÁÉÍÓÚÜÑáéíóúüñ0-9 ]+"
            required autofocus>
            <br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email"
            placeholder="Introduce tu email" required>
            <br><br>

            <label for="edad">Edad:</label>
            <input type="number" id="edad" name="edad"
            min="18" max="99"
            placeholder="Introduce tu edad" required>
            <br><br>

            <label for="telefono">Teléfono:</label>
            <input type="tel" id="telefono" name="telefono"
            placeholder="Introduce tu teléfono" required>
            <br><br>

            <label for="consulta">Consulta:</label>
            <textarea id="consulta" name="consulta"
            placeholder="Escribe tu consulta" required></textarea>
            <br><br>

            <input type="checkbox" id="privacidad"
            name="privacidad" required>
            <label for="privacidad">
                Acepto la política de privacidad y cookies
            </label>

        </fieldset>

        <input type="submit" value="Enviar">

    </form>
    <h2>Datos de contacto</h2>

        <p>Clínica DIW - Alicante</p>

        <p>Teléfono: <a href="tel:+34965000000">965 000 000</a>
        </p>

        <p>Email: info@clinicadiw.com</p>
</section>
